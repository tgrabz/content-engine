[project]
name = "content-engine"
version = "0.1.0"
description = "Instagram content automation — scrape, edit, post"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "cryptography>=42.0",
    "aiofiles>=24.1",
    "websockets>=12.0",
    # Video processing
    "Pillow>=10.3",
    "numpy>=2.0",
    "opencv-python-headless>=4.8",
    "imageio[ffmpeg]>=2.31",
    # Scraping
    "selenium>=4.21",
    "webdriver-manager>=4.0",
    "yt-dlp>=2024.0",
    # HTTP
    "requests>=2.31",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[tool.ruff]
line-length = 100
target-version = "py311"
